name: wedding

services:
  web:
    build: .
    image: wedding-website:latest
    container_name: wedding-web
    restart: unless-stopped
    ports:
      # Public on port 4321. If you put a reverse proxy (Caddy/Nginx) in front,
      # bind to localhost only instead: "127.0.0.1:4321:4321"
      - "4321:4321"
    environment:
      # Absolute paths on the named volume below — survives rebuilds.
      DATABASE_URL: file:/data/wedding.db
      PHOTO_STORAGE_DIR: /data/photos
      PHOTO_AVIF_ENABLED: ${PHOTO_AVIF_ENABLED:-true}
      INVITE_COOKIE_DAYS: ${INVITE_COOKIE_DAYS:-30}
      # Required: generate with `openssl rand -hex 32` into the root .env
      INVITE_ADMIN_TOKEN: ${INVITE_ADMIN_TOKEN:?Set INVITE_ADMIN_TOKEN in .env (openssl rand -hex 32)}
      # Uncomment only for a remote libSQL/Turso database:
      # DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
    volumes:
      - wedding-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  wedding-data:
