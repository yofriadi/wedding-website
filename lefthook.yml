# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      # oxlint does not lint plain yaml/md/css; keep this to source/config JS-like files
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,astro,json}"
      run: pnpm oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      # oxfmt currently ignores .astro in this repo; keep no-error so mixed commits still pass
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,astro,json,yml,yaml,css,md,mdx}"
      run: pnpm oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
