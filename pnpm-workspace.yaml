packages:
  - apps/*
  - packages/*
autoInstallPeers: false
# Fresh major upgrades land faster than pnpm's default release-age gate.
# Revisit once the stack settles; prefer raising this for supply-chain hardening.
minimumReleaseAge: 0
# Stop every turbo/pnpm script from reinstalling deps and thrashing node_modules.
verifyDepsBeforeRun: warn
allowBuilds:
  esbuild: true
  sharp: true
catalog:
  "@libsql/client": 0.17.4
  "@types/node": ^26.6.2
  dotenv: ^18.0.1
  # TS 7 drops the programmatic API `astro check` needs; stay on 6.x until
  # https://github.com/withastro/roadmap/discussions/1321 ships.
  typescript: ^6.0.3
  zod: ^4.6.5
