# Placeholder-blob allowlist for private media paths.
#
# apps/web/public/ ships PLACEHOLDERS at the master paths; the real private
# photos and video live only on the maintainer's disk, overlaid by
# tools/restore-private-media.sh and hidden from git with `skip-worktree`.
#
# skip-worktree is a caching hint, not a security boundary: git porcelain
# (stash, reset --hard, checkout across branches, rebase, am, read-tree -m -u,
# sparse-checkout, and libgit2/JGit clients) clears it routinely. When it is
# cleared, ~5 MB of real private media shows up as an ordinary modification and
# one `git commit -a` publishes it — into a public repository's history, where
# it is effectively unrecoverable.
#
# This file is that boundary. It pins the exact placeholder blob expected at
# each protected path, so a real file cannot be committed by accident: the blob
# SHA differs, and tools/assert-placeholders.sh rejects it in the pre-commit
# hook and in CI. Sizes are NOT a usable discriminator here — the smallest real
# master (square-mid-left.avif, 22.5 KB) is smaller than several legitimately
# committed assets (wedding_photo-1536.webp, 111 KB).
#
# Regenerate DELIBERATELY, and only after reading the diff:
#   tools/assert-placeholders.sh --update
#
# <blob-sha>  <path>
